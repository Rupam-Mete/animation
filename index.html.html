<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Interactive Hand-Controlled Particle System</title>
    <style>
        body { margin: 0; overflow: hidden; background: #000; font-family: sans-serif; }
        canvas { display: block; position: absolute; top: 0; left: 0; z-index: 1; }
        #video-container {
            position: absolute;
            bottom: 20px;
            right: 20px;
            width: 200px;
            height: 150px;
            z-index: 2;
            border: 2px solid rgba(255, 255, 255, 0.3);
            border-radius: 10px;
            overflow: hidden;
            transform: scaleX(-1); /* Mirror the preview */
        }
        video { width: 100%; height: 100%; object-fit: cover; }
        #ui {
            position: absolute;
            top: 20px;
            left: 20px;
            color: white;
            z-index: 3;
            background: rgba(0, 0, 0, 0.6);
            padding: 15px;
            border-radius: 8px;
            pointer-events: none;
        }
        h1 { margin: 0 0 10px 0; font-size: 1.2rem; }
        p { margin: 5px 0; font-size: 0.9rem; color: #ccc; }
        .highlight { color: #00ffcc; font-weight: bold; }
    </style>
</head>
<body>

    <div id="ui">
        <h1>Particle Controller</h1>
        <p>Current Shape: <span id="shape-name" class="highlight">Sphere</span></p>
        <p>🖐 <b>Open Hand:</b> Cycle Shape</p>
        <p>👌 <b>Pinch:</b> Expand/Contract</p>
        <p>✊ <b>Fist:</b> Randomize Colors</p>
    </div>

    <div id="video-container">
        <video id="input_video"></video>
    </div>

    <div id="canvas-container"></div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/control_utils/control_utils.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/drawing_utils/drawing_utils.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js"></script>

    <script>
        // --- CONFIGURATION ---
        const PARTICLE_COUNT = 3000;
        const PARTICLE_SIZE = 0.15;
        
        // --- THREE.JS SETUP ---
        const scene = new THREE.Scene();
        // Add subtle fog for depth
        scene.fog = new THREE.FogExp2(0x000000, 0.02);

        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.z = 20;

        const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(window.devicePixelRatio);
        document.getElementById('canvas-container').appendChild(renderer.domElement);

        // --- PARTICLE SYSTEM ---
        const geometry = new THREE.BufferGeometry();
        const positions = new Float32Array(PARTICLE_COUNT * 3);
        const colors = new Float32Array(PARTICLE_COUNT * 3);
        const targetPositions = new Float32Array(PARTICLE_COUNT * 3); // Where particles want to go
        
        const colorBase = new THREE.Color();
        
        // Initialize random positions
        for (let i = 0; i < PARTICLE_COUNT; i++) {
            positions[i * 3] = (Math.random() - 0.5) * 50;
            positions[i * 3 + 1] = (Math.random() - 0.5) * 50;
            positions[i * 3 + 2] = (Math.random() - 0.5) * 50;
            
            colorBase.setHSL(Math.random(), 0.7, 0.5);
            colors[i * 3] = colorBase.r;
            colors[i * 3 + 1] = colorBase.g;
            colors[i * 3 + 2] = colorBase.b;
        }

        geometry.setAttribute('position', new THREE.BufferAttribute(positions, 3));
        geometry.setAttribute('color', new THREE.BufferAttribute(colors, 3));

        // Create a soft glow texture for particles
        const sprite = new THREE.TextureLoader().load('https://threejs.org/examples/textures/sprites/disc.png');

        const material = new THREE.PointsMaterial({
            size: PARTICLE_SIZE,
            vertexColors: true,
            map: sprite,
            alphaTest: 0.5,
            transparent: true,
            opacity: 0.8,
            blending: THREE.AdditiveBlending
        });

        const particles = new THREE.Points(geometry, material);
        scene.add(particles);

        // --- SHAPE GENERATORS (MATH) ---
        // Helper to get random point on sphere
        function getSpherePoint(r) {
            const theta = Math.random() * 2 * Math.PI;
            const phi = Math.acos(2 * Math.random() - 1);
            return {
                x: r * Math.sin(phi) * Math.cos(theta),
                y: r * Math.sin(phi) * Math.sin(theta),
                z: r * Math.cos(phi)
            };
        }

        const shapes = {
            'Sphere': (i) => {
                return getSpherePoint(8);
            },
            'Heart': (i) => {
                // Heart curve equation
                let t = Math.random() * Math.PI * 2;
                // Distribute points to fill volume slightly
                let r = Math.sqrt(Math.random()) * 0.5 + 0.5; 
                let x = 16 * Math.pow(Math.sin(t), 3);
                let y = 13 * Math.cos(t) - 5 * Math.cos(2*t) - 2 * Math.cos(3*t) - Math.cos(4*t);
                return { x: x * r * 0.5, y: y * r * 0.5, z: (Math.random() - 0.5) * 4 };
            },
            'Saturn': (i) => {
                // 70% in ring, 30% in planet
                if (Math.random() > 0.3) {
                    const angle = Math.random() * Math.PI * 2;
                    const r = 8 + Math.random() * 4;
                    return { x: Math.cos(angle) * r, y: (Math.random()-0.5), z: Math.sin(angle) * r };
                } else {
                    return getSpherePoint(4);
                }
            },
            'Flower': (i) => {
                // Rose curve (polar coordinates)
                const k = 4; // number of petals
                const theta = Math.random() * Math.PI * 2;
                const r = Math.cos(k * theta) * 10;
                return {
                    x: r * Math.cos(theta),
                    y: r * Math.sin(theta),
                    z: (Math.random() - 0.5) * 5
                };
            }
        };

        let currentShapeKeys = Object.keys(shapes);
        let currentShapeIndex = 0;
        let transitionSpeed = 0.05;

        function setShape(shapeName) {
            document.getElementById('shape-name').innerText = shapeName;
            const generator = shapes[shapeName];
            
            for (let i = 0; i < PARTICLE_COUNT; i++) {
                const p = generator(i);
                targetPositions[i * 3] = p.x;
                targetPositions[i * 3 + 1] = p.y;
                targetPositions[i * 3 + 2] = p.z;
            }
        }

        // Initialize with Sphere
        setShape('Sphere');

        // --- HAND TRACKING LOGIC ---
        const videoElement = document.getElementById('input_video');
        
        let gestureCooldown = false;
        let scaleFactor = 1;
        
        function onResults(results) {
            if (results.multiHandLandmarks && results.multiHandLandmarks.length > 0) {
                const landmarks = results.multiHandLandmarks[0];
                
                // 1. PINCH DETECTION (Thumb tip to Index tip distance)
                const thumbTip = landmarks[4];
                const indexTip = landmarks[8];
                const distance = Math.sqrt(
                    Math.pow(thumbTip.x - indexTip.x, 2) + 
                    Math.pow(thumbTip.y - indexTip.y, 2)
                );

                // Map pinch distance to scale (inverted because video is mirrored/screen coords)
                // Distance usually varies between 0.02 (touching) and 0.2+ (open)
                scaleFactor = THREE.MathUtils.lerp(scaleFactor, 1 + distance * 5, 0.1);

                // 2. FIST DETECTION (Fingers folded)
                const tips = [8, 12, 16, 20];
                const bases = [5, 9, 13, 17];
                let foldedCount = 0;
                tips.forEach((tipIdx, i) => {
                    if (landmarks[tipIdx].y > landmarks[bases[i]].y) foldedCount++; // y increases downwards
                });

                if (foldedCount >= 3 && !gestureCooldown) {
                    // FIST: Randomize Colors
                    triggerColorChange();
                    startCooldown(500);
                }

                // 3. OPEN PALM DETECTION (Switch Shape)
                if (distance > 0.15 && foldedCount === 0 && !gestureCooldown) {
                    // Open hand spread wide
                    cycleShape();
                    startCooldown(1500); // Longer cooldown for shape switch
                }

                // 4. ROTATION (Hand Position)
                // Use wrist position to rotate the scene
                const wrist = landmarks[0];
                const targetRotX = (wrist.y - 0.5) * 2;
                const targetRotY = (wrist.x - 0.5) * 2;
                
                particles.rotation.x += (targetRotX - particles.rotation.x) * 0.05;
                particles.rotation.y += (targetRotY - particles.rotation.y) * 0.05;
            }
        }

        function triggerColorChange() {
            const hueOffset = Math.random();
            const colorsAttr = geometry.attributes.color;
            for (let i = 0; i < PARTICLE_COUNT; i++) {
                colorBase.setHSL((hueOffset + (i / PARTICLE_COUNT)) % 1, 0.8, 0.5);
                colorsAttr.setXYZ(i, colorBase.r, colorBase.g, colorBase.b);
            }
            colorsAttr.needsUpdate = true;
        }

        function cycleShape() {
            currentShapeIndex = (currentShapeIndex + 1) % currentShapeKeys.length;
            setShape(currentShapeKeys[currentShapeIndex]);
        }

        function startCooldown(ms) {
            gestureCooldown = true;
            setTimeout(() => { gestureCooldown = false; }, ms);
        }

        // --- MEDIAPIPE SETUP ---
        const hands = new Hands({locateFile: (file) => {
            return `https://cdn.jsdelivr.net/npm/@mediapipe/hands/${file}`;
        }});
        
        hands.setOptions({
            maxNumHands: 1,
            modelComplexity: 1,
            minDetectionConfidence: 0.5,
            minTrackingConfidence: 0.5
        });
        
        hands.onResults(onResults);

        const cameraUtils = new Camera(videoElement, {
            onFrame: async () => {
                await hands.send({image: videoElement});
            },
            width: 640,
            height: 480
        });
        
        cameraUtils.start();

        // --- ANIMATION LOOP ---
        function animate() {
            requestAnimationFrame(animate);

            const posAttr = geometry.attributes.position;
            
            // Interpolate particles towards their target shape positions
            for (let i = 0; i < PARTICLE_COUNT; i++) {
                const tx = targetPositions[i * 3];
                const ty = targetPositions[i * 3 + 1];
                const tz = targetPositions[i * 3 + 2];
                
                // Current
                let cx = posAttr.getX(i);
                let cy = posAttr.getY(i);
                let cz = posAttr.getZ(i);

                // Lerp towards target
                cx += (tx - cx) * transitionSpeed;
                cy += (ty - cy) * transitionSpeed;
                cz += (tz - cz) * transitionSpeed;
                
                // Apply subtle noise/jitter for "aliveness"
                cx += (Math.random() - 0.5) * 0.05;
                cy += (Math.random() - 0.5) * 0.05;
                cz += (Math.random() - 0.5) * 0.05;

                posAttr.setXYZ(i, cx, cy, cz);
            }
            
            posAttr.needsUpdate = true;

            // Apply global scale based on pinch
            particles.scale.setScalar(scaleFactor);

            // Slow idle rotation
            particles.rotation.z += 0.002;

            renderer.render(scene, camera);
        }

        // Handle resize
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        animate();

    </script>
</body>
</html>
